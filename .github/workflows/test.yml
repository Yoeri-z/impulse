name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'packages/**/example/**'
      - 'examples/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'packages/**/example/**'
      - 'examples/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [impulse, impulse_flutter, impulse_signals]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Run tests with coverage
        run: |
          if grep -q "sdk: flutter" packages/${{ matrix.package }}/pubspec.yaml; then
            flutter test --coverage packages/${{ matrix.package }}
          else
            dart test --coverage=packages/${{ matrix.package }}/coverage packages/${{ matrix.package }}
            dart pub global activate coverage
            dart pub global run coverage:format_coverage \
              --lcov \
              --in=packages/${{ matrix.package }}/coverage \
              --out=packages/${{ matrix.package }}/coverage/lcov.info \
              --packages=.dart_tool/package_config.json \
              --report-on=packages/${{ matrix.package }}/lib
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          fail_ci_if_error: true
